server:
  port: 8080

logging:
  level:
    # 本工程日志级别：info=请求/耗时/异常摘要；debug=额外打印消息内容与 SSE 每个片段
    # 可用环境变量覆盖：APP_LOG_LEVEL=debug
    com.dj.ai.agentchat: ${APP_LOG_LEVEL:info}

spring:
  application:
    name: dj-agent-chat

  # ---- Spring AI / 火山方舟（配置 key 已经 M7 jar 构建期核验）----
  ai:
    # ---- 迭代2：Spring AI 重试（同步路径；前缀 spring.ai.retry 已经 M7 jar 实证）----
    # M7 ResponseErrorHandler 状态码分类（字节码实证顺序）：on-http-codes 命中→Transient（可重试）；
    # 默认 on-client-errors=false 时其余 4xx→NonTransient；5xx→Transient。
    # 故 429 在此显式放行重试；400/401/404 等保持不可重试；缺 Key（401）不重试。
    # 网络层故障（ResourceAccessException，连接拒绝/超时）由自定义 RetryTemplate 追加（见 ChatRetryConfig）。
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
      on-http-codes:
        - 429
    openai:
      # 方舟 Coding Plan OpenAI 兼容端点
      base-url: https://ark.cn-beijing.volces.com/api/coding/v3
      # 密钥外置：环境变量优先。
      # 构建期核验（M7 jar 实测）：M7 各 OpenAI 模型自动配置在 bean 创建期断言 api-key 非空白，
      # 空字符串会导致上下文启动失败（"OpenAI API key must be set ..."）。
      # 故默认值使用明显非法的占位串（不是真实凭证、不会被发出：ChatService 调用前检测到
      # 该占位值即按「未配置」处理：同步 503 / 流式 error 事件）；设置 ARK_API_KEY 后覆盖。
      api-key: ${ARK_API_KEY:ark-placeholder-not-configured}
      chat:
        # M7 默认拼接 /v1/chat/completions；方舟 coding 端点最终 URL 必须为
        # https://ark.cn-beijing.volces.com/api/coding/v3/chat/completions，
        # 故覆写为 /chat/completions（已经 Spring 6.2 DefaultUriBuilderFactory 离线验证为路径追加）。
        # 【联调首验项】：若方舟实际路径不同，按联调返回的 404/400 调整；
        # 备选配法：base-url=https://ark.cn-beijing.volces.com/api/coding + completions-path=/v3/chat/completions
        completions-path: /chat/completions
        options:
          # 模型/接入点 ID 完全由配置决定，代码不硬编码（AC-7）
          model: ${ARK_CHAT_MODEL:}
          temperature: 0.7
          # 推理模型思考链开关（方舟实测认 reasoning_effort 参数）：
          # none=关闭思考，简单对话快（实测 4.6s→1.1s）；需要深度推理时设 high 或删掉此行走模型默认。
          # 可用环境变量 ARK_REASONING_EFFORT=high 覆盖。
          reasoning-effort: ${ARK_REASONING_EFFORT:none}

  # ---- 存储预留 1/3：MySQL（HikariCP；本期不连库、不建表）----
  datasource:
    # 时区（迭代4 冒烟实证）：MySQL 容器默认 UTC，connector-j 9.x 中 serverTimezone 仅弃用别名、
    # 不强制会话时区，而 MyBatis 把 TIMESTAMP 读成 LocalDateTime 取的是 MySQL 会话墙钟——
    # 必须 connectionTimeZone + forceConnectionTimeZoneToSession=true 让驱动在每条连接上
    # SET time_zone='Asia/Shanghai'，CURRENT_TIMESTAMP 落库与读取才是北京时间（部署环境若
    # 无命名时区表，可把 Asia/Shanghai 换成 +08:00 偏移量，效果相同）。
    url: jdbc:mysql://127.0.0.1:13306/dj_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 关键：关闭 Hikari 启动时快速失败连接探测，保证 MySQL 不可达也能启动（AC-2）
      initialization-fail-timeout: -1
      pool-name: DjAgentHikariPool

  # ---- 存储预留 2/3：Redis（Lettuce 原生懒连接，首条命令才建连）----
  # 注：构建期核验发现 Boot 3.4 下 lettuce.pool.enabled=true 但 classpath 无
  # commons-pool2 会在上下文刷新期抛 NoClassDefFoundError，故本期不开启连接池
  # （本期不使用 Redis，连接池无关；后续启用 Redis 时再引入 commons-pool2 并开启）。
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      database: 0
      timeout: 3s

  # ---- 迭代6：multipart 上传（知识库 md/txt，单文件 10MB）----
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# ---- 迭代3：MyBatis-Plus 持久层（会话记忆）----
# 无 mapper XML（注解 SQL），不配 mapper-locations；下划线列↔驼峰属性显式固化（MP 默认即 true）。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# ---- 存储预留 3/3：Postgres（后续 pgvector/RAG）----
# 自定义命名空间，不绑定任何 Spring 自动配置，仅作连接参数预留；
# 后续启用多数据源时迁移为自定义 DataSource bean 配置。
app:
  storage:
    postgres:
      url: jdbc:postgresql://127.0.0.1:15432/dj_agent_vec
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
  chat:
    # SSE 流超时时间（毫秒）
    sse-timeout-ms: 120000

    # ---- 迭代3：会话记忆（ChatMemory + MySQL/MyBatis-Plus）----
    memory:
      # 记忆总开关：false 时不装配记忆 Mapper/Store bean、不建表；会话路径请求 400，无状态不受影响
      enabled: ${APP_CHAT_MEMORY_ENABLED:true}
      # 续接加载最近 N 条历史（落库全量不裁剪）
      max-history: ${APP_CHAT_MEMORY_MAX_HISTORY:20}
      # 启动期 best-effort 建表（DB 不可达仅 warn，不阻断启动；懒建表保证首次记忆路径自愈）
      init-on-startup: ${APP_CHAT_MEMORY_INIT_ON_STARTUP:true}

    # ---- 迭代2：默认系统提示词（条件装配）----
    # 非空白 → ChatClient.defaultSystem(...) 对每次调用生效（系统消息置于消息列表最前）；
    # 空白（默认）= 迭代 1 行为，不注入系统消息。留空时支持多环境差异：不设即纯用户对话。
    system-prompt: ${APP_CHAT_SYSTEM_PROMPT:}

    # ---- 迭代2：SSE 空闲心跳 ----
    # 模型「思考期」无任何字节时，按间隔发 SSE 注释帧（:keepalive，EventSource 标准忽略），
    # 防 Nginx/网关/浏览器空闲断连；每个模型片段到达即重置计时；
    # 完成/出错/超时/客户端断连四条路径全部取消心跳。
    heartbeat:
      enabled: ${APP_CHAT_HEARTBEAT_ENABLED:true}
      interval: ${APP_CHAT_HEARTBEAT_INTERVAL:15s}
      text: ${APP_CHAT_HEARTBEAT_TEXT:keepalive}

    # ---- 迭代2：HTTP 连接池与超时（同步 Apache HttpClient5 / 流式 Reactor Netty）----
    # 全部参数外置；默认值面向本地开发与小规模联调，生产按并发量上调 pool 上限。
    http:
      sync:
        connect-timeout: 5s
        read-timeout: 60s
        connection-request-timeout: 5s
        pool:
          max-total: 20
          max-per-route: 20
      stream:
        connect-timeout: 5s
        response-timeout: 60s
        pool:
          max-connections: 20
          pending-acquire-max-count: 40
          pending-acquire-timeout: 5s
          max-idle-time: 30s

    # ---- 迭代2：流式路径应用层重试（框架 RetryTemplate 不覆盖 stream）----
    # 仅在「首个模型片段到达前」对 429/5xx/网络 IO 故障有限重试；首片段后中断不重放。
    # 退避与同步 spring.ai.retry 对齐（1s 起、指数 2x、上限 10s）。
    retry:
      stream:
        max-attempts: 3
        min-backoff: 1s
        max-backoff: 10s

  # ---- 插入迭代 G：DB 工具注册表 + 工具调用闭环 + 日志分析工具 ----
  tools:
    # 工具总开关：false 时工具运行时全家桶不装配（Mapper 不扫描、对话零工具挂载），
    # 管理端 web 层常驻但被拦截器挡为 400 TOOLS_DISABLED（AC-2）。
    enabled: ${APP_TOOLS_ENABLED:true}
    # SCRIPT 工具白名单根目录（相对 CWD；生产只读挂载，强烈建议配绝对路径）。
    script-dir: ${APP_TOOLS_SCRIPT_DIR:scripts}
    # 工具执行专用 daemon 线程池大小（与模型 boundedElastic 隔离，避免池饥饿）。
    executor-pool-size: ${APP_TOOLS_EXECUTOR_POOL_SIZE:4}
    # 表行 timeout_ms / output_max_chars 缺省值；timeout 硬上限 60000（管理端校验拦截超限）。
    default-timeout-ms: 30000
    default-output-max-chars: 8000
    # 增补脱敏正则（可选；启动编译为 Pattern，编译失败仅 WARN 跳过该条）。
    redact-patterns: []
    builtin:
      # 日志分析根目录（相对 CWD；mvn CWD=backend/ vs nohup CWD=仓库根有差异，建议绝对路径）。
      log-dir: ${APP_TOOLS_LOG_DIR:logs}
      # 扫描三上限：文件数 / 单文件字节（50MB）/ 累计行数；触顶停止并标注 truncated。
      scan-max-files: ${APP_TOOLS_SCAN_MAX_FILES:200}
      scan-max-bytes-per-file: ${APP_TOOLS_SCAN_MAX_BYTES:52428800}
      scan-max-lines: ${APP_TOOLS_SCAN_MAX_LINES:200000}

    # ---- 插入迭代4：MCP 工具接入（stdio 子进程；默认零 server，行为与迭代 G 一致）----
    mcp:
      # MCP 子开关（受 app.tools.enabled 总开关统管）：false 时不装配 MCP 运行时、不起子进程，
      # DB 工具正常；管理端 /api/admin/mcp/servers 返回空列表。
      enabled: ${APP_TOOLS_MCP_ENABLED:true}
      # SDK 握手/协议请求超时；工具调用执行超时复用上面的 default-timeout-ms（硬顶 60s）。
      request-timeout: ${APP_TOOLS_MCP_REQUEST_TIMEOUT:20s}
      # MCP server 声明列表（command 建议绝对路径；args 数组直传 argv，不经 shell，禁 sh -c）。
      # 默认空 = 不起任何子进程。冒烟/部署示例（详见 README「MCP 工具接入」段）：
      # servers:
      #   - name: everything
      #     command: /opt/homebrew/bin/npx
      #     args: ["-y", "@modelcontextprotocol/server-everything"]
      #   - name: fs
      #     command: /opt/homebrew/bin/npx
      #     args: ["-y", "@modelcontextprotocol/server-filesystem", "mcp-workspace"]
      servers: []

  # ---- 迭代5：SDD 子 Agent 编排（Planner/Executor 顺序循环）----
  # 总开关默认 false：关闭时编排 bean 全家桶不装配（Mapper 不扫描、Clients/Service 不创建），
  # 对话零额外模型调用、SSE 零 plan/task 帧，行为与迭代4 逐字节一致（AC-1/AC-2）。
  # 提示词语义与 app.chat.system-prompt 不同：sdd 角色提示词空白=回退内置默认常量（角色必有提示词）。
  sdd:
    enabled: ${APP_SDD_ENABLED:false}
    # Planner 调用轮次硬顶（路由=第 1 轮；理论模型调用上限=1+max-rounds+max-tasks+1=16）
    max-rounds: ${APP_SDD_MAX_ROUNDS:6}
    # 累计子任务数硬顶（含重试/跳过）
    max-tasks: ${APP_SDD_MAX_TASKS:8}
    # 连续失败硬顶（成功/跳过重置）
    max-consecutive-failures: ${APP_SDD_MAX_CONSECUTIVE_FAILURES:2}
    # 总墙钟预算：必须短于容器超时（SSE sse-timeout-ms=120s / 同步 read-timeout=60s）
    total-budget-sse: ${APP_SDD_TOTAL_BUDGET_SSE:110s}
    total-budget-sync: ${APP_SDD_TOTAL_BUDGET_SYNC:55s}
    # 单子任务超时；空白=继承模型 HTTP 读超时（60s），受总预算剩余时间兜底
    task-timeout: ${APP_SDD_TASK_TIMEOUT:}
    planner:
      # 空白=继承 spring.ai.openai.chat.options.model
      model: ${APP_SDD_PLANNER_MODEL:}
      # 空白=回退内置默认 Planner 提示词常量（非「不注入」语义）
      system-prompt: ${APP_SDD_PLANNER_SYSTEM_PROMPT:}
      temperature: ${APP_SDD_PLANNER_TEMPERATURE:}
    executor:
      model: ${APP_SDD_EXECUTOR_MODEL:}
      system-prompt: ${APP_SDD_EXECUTOR_SYSTEM_PROMPT:}
      temperature: ${APP_SDD_EXECUTOR_TEMPERATURE:}
      # 子任务结果回灌 Planner 前的截断字符数（附截断标记）
      max-result-chars: ${APP_SDD_EXECUTOR_MAX_RESULT_CHARS:2000}

  # ---- 迭代6：RAG 知识库（管理端上传 md/txt → bge-m3 向量化 → pgvector；常驻 Advisor）----
  # 总开关默认 false：关闭时 RAG 全家桶不装配（PG 连接池不初始化、Ollama 客户端不创建、
  # RagAdvisor 不挂载），对话链路与迭代5 逐字节一致（N3）。
  rag:
    enabled: ${APP_RAG_ENABLED:false}
    datasource:
      # 独立第二数据源（PG/pgvector）；MySQL 仍是 @Primary，本项不走 spring.datasource 自动配置。
      # 指向 docker db-postgres-1 的 ai_vector 库（首次懒建表时 CREATE EXTENSION vector）。
      jdbc-url: ${RAG_DB_URL:jdbc:postgresql://127.0.0.1:15432/ai_vector}
      username: ${RAG_DB_USER:postgres}
      password: ${RAG_DB_PASSWORD:postgres}
    ollama:
      # 本机 Ollama（OpenAI 兼容 /v1/embeddings）；离线优先，不依赖外网。
      base-url: ${RAG_OLLAMA_BASE_URL:http://localhost:11434}
      # bge-m3 输出固定 1024 维，与 rag_chunk.embedding vector(1024) 绑定；换模型需重建表。
      model: ${RAG_OLLAMA_MODEL:bge-m3}
      timeout-ms: ${RAG_OLLAMA_TIMEOUT_MS:10000}
    chunk:
      # 单片段最大字符数 / 相邻重叠；heading-aware 先按 #{1,3} 标题切段再滑窗。
      max-chars: ${RAG_CHUNK_MAX_CHARS:500}
      overlap: ${RAG_CHUNK_OVERLAP:80}
      heading-aware: ${RAG_CHUNK_HEADING_AWARE:true}
    retrieve:
      # top-k 候选；余弦阈值（实测相关 0.78/无关 0.37，0.45 间隔充裕），低于不注入。
      top-k: ${RAG_RETRIEVE_TOP_K:4}
      min-score: ${RAG_RETRIEVE_MIN_SCORE:0.45}
    upload:
      # 单文件字节上限（须 ≤ multipart max-file-size=10MB）；扩展名白名单小写无点。
      max-file-bytes: ${RAG_UPLOAD_MAX_FILE_BYTES:10485760}
      allowed-ext: ${RAG_UPLOAD_ALLOWED_EXT:md,markdown,txt}
      # 单文档切片数硬顶（同步上传时延保护，超限 400 提示拆分）
      max-chunks: ${RAG_UPLOAD_MAX_CHUNKS:2000}

  # ---- 插入迭代 G：管理端鉴权（/api/admin/**）----
  # token 空白=未配置 → 管理端一律 503 ADMIN_NOT_CONFIGURED；仅 env / application-local.yml 注入，不入库。
  admin:
    token: ${APP_ADMIN_TOKEN:}
